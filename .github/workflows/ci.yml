name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run plugin tests
        run: npm test

      - name: Verify git dependency install
        run: |
          consumer_dir="$(mktemp -d)"
          npm init -y --prefix "$consumer_dir"
          npm install --prefix "$consumer_dir" "git+file://$GITHUB_WORKSPACE"
          node --input-type=module -e "import(process.argv[1]).then(() => process.stdout.write('git install import: PASS\n'))" "$consumer_dir/node_modules/cleat/.opencode/plugins/cleat-plugin.js"
