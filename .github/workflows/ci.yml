name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run plugin tests
        run: npm test

      - name: Verify git dependency install
        run: |
          consumer_dir="$(mktemp -d)"
          install_spec="git+file://$GITHUB_WORKSPACE"
          if [ "${ACT:-}" = "true" ]; then
            # act runs can miss full worktree git metadata; use plain file install locally.
            install_spec="file:$GITHUB_WORKSPACE"
          fi
          (
            cd "$consumer_dir"
            npm init -y
            npm install "$install_spec"
            node --input-type=module -e "import('cleat').then(() => process.stdout.write('git install import: PASS\n'))"
          )
